# Lint configuration for worldtech-jp (used by the Claude Code session-start hook and locally).
# Keep the rule set small and stable: pyflakes + core pycodestyle errors only.
target-version = "py311"
line-length = 120
extend-exclude = ["articles", "en", "data", "docs", "iamyou", "css"]

[lint]
select = ["E4", "E7", "E9", "F"]
