<style>
  :root{
    --ink:#11131a; --ink-2:#3b414f; --muted:#7c8395; --line:#e7e9f0; --bg:#ffffff; --bg-soft:#f6f7fb;
    --accent:#ff6a3d; --accent-d:#e6552a; --gold:#c9a24b; --eye:#3b82f6; --hand:#ef5da8; --foot:#22b07d;
    --radius:14px; --maxw:1080px; --shadow:0 1px 3px rgba(17,19,26,.05),0 12px 32px rgba(17,19,26,.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;line-height:1.75;font-size:15.5px;}
  a{color:inherit;text-decoration:none;} img{max-width:100%;display:block;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}
  .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
  .topbar .in{max-width:var(--maxw);margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:16px;}
  .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:-.02em;}
  .logo .m{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--accent),#ff9a3d);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;}
  .nav{display:flex;gap:20px;margin-left:12px;}
  .nav a{font-size:13.5px;font-weight:600;color:var(--ink-2);}
  .nav a:hover{color:var(--ink);}
  .spacer{flex:1;}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .lang button{border:0;background:#fff;font:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:6px 11px;cursor:pointer;}
  .lang button.on{background:var(--ink);color:#fff;}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .btn:hover{border-color:var(--ink);}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.primary:hover{background:var(--accent);border-color:var(--accent);}
  .btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.accent:hover{background:var(--accent-d);border-color:var(--accent-d);}
  @media(max-width:820px){ .nav{display:none;} }
  .hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 80% -10%,#1d2440 0%,#0e1016 55%);color:#fff;}
  .hero .in{max-width:var(--maxw);margin:0 auto;padding:74px 22px 70px;}
  .hero h1{font-size:clamp(30px,6vw,46px);line-height:1.12;letter-spacing:-.03em;margin:14px 0 10px;font-weight:900;}
  .hero h1 .acc{color:var(--accent);}
  .hero .lead{font-size:17px;color:#c9cee0;max-width:640px;margin:0 0 12px;}
  .hero .sub{font-size:14px;color:#9aa2bd;max-width:620px;margin:0 0 26px;}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap;}
  .hero .note{margin-top:18px;font-size:12px;color:#8b93b0;display:flex;align-items:center;gap:7px;}
  .hero .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex-shrink:0;}
  section{padding:64px 0;}
  .shead{text-align:center;max-width:660px;margin:0 auto 38px;}
  .shead h2{font-size:28px;letter-spacing:-.02em;margin:8px 0 8px;font-weight:800;}
  .shead p{color:var(--muted);font-size:14.5px;margin:0;}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .vcard{border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;background:#fff;transition:transform .15s,box-shadow .15s;}
  .vcard:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
  .vcard .ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff;margin-bottom:14px;}
  .vcard h3{font-size:19px;margin:0 0 4px;font-weight:800;} .vcard .en{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);}
  .vcard p{font-size:13.5px;color:var(--ink-2);margin:8px 0 0;}
  .svc{background:var(--bg-soft);}
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .scard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;}
  .scard .ph{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);}
  .scard h3{font-size:16.5px;margin:6px 0 6px;font-weight:800;}
  .scard p{font-size:13px;color:var(--ink-2);margin:0 0 14px;}
  .scard .price{margin-top:auto;font-size:20px;font-weight:900;letter-spacing:-.02em;}
  .svc-more{text-align:center;margin-top:26px;font-size:13px;color:var(--muted);}
  .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .tier{border:1px solid var(--line);border-radius:var(--radius);padding:24px;background:#fff;text-align:center;}
  .tier .t{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;}
  .tier h3{font-size:18px;margin:6px 0 8px;}
  .tier p{font-size:13px;color:var(--ink-2);min-height:40px;}
  .tier.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .agent{background:linear-gradient(160deg,#11131a,#23284a);color:#fff;}
  .agent .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;}
  .agent h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 12px;}
  .agent p{color:#c2c8de;font-size:14.5px;}
  .points{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;}
  .pt{border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;}
  .pt.b{color:#cd7f32;border-color:rgba(205,127,50,.5);} .pt.s{color:#cdd2dc;border-color:rgba(205,210,220,.5);} .pt.g{color:var(--gold);border-color:rgba(201,162,75,.6);}
  .pt.d{color:#67e8f9;border-color:rgba(103,232,249,.5);} .pt.p{color:#a5b4fc;border-color:rgba(165,180,252,.6);}
  .protect{margin-top:16px;font-size:12.5px;color:#aeb6d6;border-left:3px solid var(--accent);padding-left:12px;}
  .reg{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:22px;}
  .reg h3{margin:0 0 12px;font-size:16px;}
  .reg label{display:block;font-size:12px;font-weight:700;color:#c2c8de;margin:12px 0 5px;}
  .reg input,.reg select{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;outline:none;}
  .reg input::placeholder{color:#7e87a6;}
  .reg .btn.accent{width:100%;justify-content:center;margin-top:14px;}
  .reg .hint{font-size:10.5px;color:#8b93b0;margin-top:8px;text-align:center;}
  .rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .rev{border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .rev h3{font-size:15px;margin:0 0 6px;} .rev p{font-size:13px;color:var(--ink-2);margin:0;}
  .legal{background:var(--bg-soft);}
  .legal .box{border:1px dashed #c9cdd8;border-radius:var(--radius);padding:20px 22px;font-size:12.5px;color:var(--ink-2);}
  .legal b{color:var(--ink);}
  .footer{background:var(--ink);color:#aeb4c6;padding:34px 0 26px;}
  .footer .in{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;}
  .footer .soc a{color:#cdd2e0;font-size:13px;margin-left:14px;}
  .foot-note{font-size:11.5px;color:#6f7795;margin-top:16px;text-align:center;}
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(8,9,14,.6);padding:20px;}
  .modal.show{display:flex;}
  .modal .card{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:26px;text-align:center;}
  .modal .card h3{margin:0 0 8px;font-size:19px;} .modal .card p{color:var(--ink-2);font-size:13.5px;margin:0 0 16px;}
  .modal .card .small{font-size:11.5px;color:var(--muted);} .modal .x{margin-top:14px;}
  @media(max-width:760px){ .three,.svc-grid,.tiers,.rev-grid{grid-template-columns:1fr;} .agent .grid{grid-template-columns:1fr;} }
</style>
</head>

var LANG='ja';
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(I18N[LANG][k]!=null)el.innerHTML=I18N[LANG][k];});
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){var k=el.getAttribute('data-i18n-ph');if(I18N[LANG][k]!=null)el.setAttribute('placeholder',I18N[LANG][k]);});
  document.getElementById('lang-ja').classList.toggle('on',LANG==='ja');
  document.getElementById('lang-en').classList.toggle('on',LANG==='en');
}
function setLang(l){ LANG=l; applyI18n(); }
applyI18n();

function openModal(kind){
  var m=MODAL[LANG][kind]||MODAL[LANG].signup;
  document.getElementById('m-title').textContent=m[0];
  document.getElementById('m-body').textContent=m[1];
  document.getElementById('m-small').textContent=m[2];
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
function showMsg(a){ document.getElementById('m-title').textContent=a[0]; document.getElementById('m-body').textContent=a[1];
  document.getElementById('m-small').textContent=a[2]; document.getElementById('modal').classList.add('show'); }
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function fakeSubmit(e){ e.preventDefault();
  var data={name:val('rg-name'),area:val('rg-area'),role:val('rg-role'),contact:val('rg-contact')};
  fetch('/api/agent/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){ showMsg((res.ok&&res.j&&res.j.accepted)?MODAL[LANG].applied:MODAL[LANG].invalid); })
    .catch(function(){ showMsg(MODAL[LANG].offline); });   // 静的（API無し）＝受付前を正直に表示
  return false; }
