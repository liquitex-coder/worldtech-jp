<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsMatome — セマンティック銀河（3D探索モード 試作）</title>
<style>
  :root{ --ink:#e9ecf5; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;color:var(--ink);}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  /* HUD */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .brand{position:absolute;top:22px;left:26px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:#5b78ff;box-shadow:0 0 14px #5b78ff;}
  .brand small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.16em;color:#8b93ad;margin-top:-2px;}
  .mode{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.32em;color:#7e88a6;text-transform:uppercase;}
  .stat{position:absolute;top:22px;right:26px;text-align:right;}
  .stat .big{font-size:13px;font-weight:700;color:#aeb8d8;}
  .stat .sub{font-size:10.5px;color:#6b7390;letter-spacing:.04em;}
  .title{position:absolute;left:26px;bottom:84px;max-width:460px;}
  .title h1{font-size:30px;line-height:1.3;margin:0 0 10px;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 30px rgba(0,0,0,.8);}
  .title p{margin:0;font-size:13px;color:#9aa3c0;line-height:1.7;}
  .hint{position:absolute;left:26px;bottom:30px;font-size:11.5px;color:#6b7390;letter-spacing:.04em;}
  .legend{position:absolute;right:26px;bottom:26px;display:grid;grid-template-columns:repeat(2,auto);gap:5px 16px;
    background:rgba(12,14,24,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px 16px;}
  .legend .it{display:flex;align-items:center;gap:7px;font-size:11px;color:#c2c9de;}
  .legend .d{width:8px;height:8px;border-radius:50%;}
  /* ツールチップ */
  #tip{position:fixed;z-index:20;pointer-events:none;display:none;max-width:240px;
    background:rgba(10,12,22,.92);border:1px solid rgba(120,140,255,.35);border-radius:10px;padding:9px 12px;
    font-size:12px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  #tip .c{font-size:10px;font-weight:700;letter-spacing:.04em;}
  #tip .t{margin-top:3px;color:#fff;}
  #tip .m{margin-top:4px;font-size:10px;color:#8a93b2;}
  .switch{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:auto;display:flex;gap:8px;
    background:rgba(12,14,24,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px;}
  .switch a{font-size:12px;color:#aeb8d8;padding:7px 14px;border-radius:999px;text-decoration:none;}
  .switch a.on{background:#5b78ff;color:#fff;font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <div class="brand"><span class="dot"></span><span>NewsMatome<small>SEMANTIC GALAXY</small></span></div>
  <div class="mode">探索モード</div>
  <div class="stat"><div class="big">今朝 07:00 の収集 — 1,284 記事</div><div class="sub">13カテゴリ / 7言語 → 日本語化</div></div>
  <div class="title">
    <h1>意味で、星座になる。</h1>
    <p>AI が全記事をベクトル化し、意味の近さで宇宙に配置。関連する話題はひとりでに星団を作ります。座標は人間が引いたものではありません。ドラッグで回し、近づいて読む。</p>
  </div>
  <div class="hint">ドラッグ＝回転　／　ホイール＝ズーム　／　星にホバー＝記事</div>
</div>

<div id="tip"><div class="c"></div><div class="t"></div><div class="m"></div></div>

<div class="switch">
  <a class="on" href="prototype-galaxy.html">🌌 銀河</a>
  <a href="prototype-globe.html">🌐 グローブ</a>
  <a href="index.html">📰 2D版</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CATS = [
  ['サイエンス', 0x0ea5e9], ['AI', 0x3b5bff], ['テクノロジー', 0x6366f1],
  ['コード', 0x9aa3b2], ['アルゴリズム', 0x8b5cf6], ['ロボット技術', 0xef4444],
  ['フィジカルAI', 0xf97316], ['アート', 0xec4899], ['デザイン', 0x14b8a6],
  ['動画', 0xfb7185], ['動物', 0x84cc16], ['自然', 0x16a34a], ['農業', 0xca8a04],
];
const SAMPLE = [
  '大規模モデルの自己検証で幻覚を減らす','室温超伝導の再現実験を第三者が確認','四足歩行ロボットが階段を予測',
  '拡散モデルでタンパク質設計','近似最近傍探索が3倍高速化','生成UIの時代に余白が再評価',
  '深海の新種をAIが自動分類','再生農業はスケールするか','触覚で世界を理解するヒューマノイド',
  'エッジ推論の新ランタイム','気候モデルの解像度が向上','OSSベクトルDBが話題',
];

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060c, 0.018);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 14, 78);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
controls.minDistance = 18; controls.maxDistance = 160;

// 背景の星
(function stars(){
  const g = new THREE.BufferGeometry(); const n=1800; const p=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const r=320+Math.random()*420; const t=Math.random()*Math.PI*2; const ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(t); p[i*3+1]=r*Math.sin(ph)*Math.sin(t); p[i*3+2]=r*Math.cos(ph); }
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x556,fog:false,size:1.1,sizeAttenuation:false})));
})();

// 円形テクスチャ（光る点）
function discTex(){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.95)');
  gr.addColorStop(.5,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gr;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
}
const disc = discTex();

// カテゴリごとの「星団」を球面に配置
const meta = [];  // {cat,color,title}
const positions = [];
const colors = [];
const tmp = new THREE.Color();
CATS.forEach((cat, ci)=>{
  // 星団中心：球面上に分散
  const phi = Math.acos(1 - 2*(ci+0.5)/CATS.length);
  const theta = Math.PI*(1+Math.sqrt(5))*ci;
  const R = 34;
  const cx = R*Math.sin(phi)*Math.cos(theta);
  const cy = R*Math.cos(phi)*0.7;
  const cz = R*Math.sin(phi)*Math.sin(theta);
  tmp.setHex(cat[1]);
  const count = 16 + Math.floor(Math.random()*22);
  for(let k=0;k<count;k++){
    const spread = 6 + Math.random()*5;
    const px = cx + (Math.random()-0.5)*spread;
    const py = cy + (Math.random()-0.5)*spread;
    const pz = cz + (Math.random()-0.5)*spread;
    positions.push(px,py,pz);
    const shade = 0.65 + Math.random()*0.35;
    colors.push(tmp.r*shade, tmp.g*shade, tmp.b*shade);
    meta.push({cat:cat[0], color:'#'+cat[1].toString(16).padStart(6,'0'),
      title: SAMPLE[(ci*3+k)%SAMPLE.length]});
  }
  // 星団ラベル（スプライト）
  scene.add(makeLabel(cat[0], cat[1], cx, cy+6, cz));
  // 中心から淡い接続線
});
const pg = new THREE.BufferGeometry();
pg.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
pg.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
const pm = new THREE.PointsMaterial({size:2.4, map:disc, vertexColors:true, transparent:true,
  depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true});
const points = new THREE.Points(pg, pm);
scene.add(points);

function makeLabel(text, hex, x,y,z){
  const c=document.createElement('canvas');const s=256;c.width=s;c.height=64;
  const g=c.getContext('2d');g.font='bold 30px "Hiragino Sans",sans-serif';
  g.fillStyle='rgba(255,255,255,.92)';g.textAlign='center';g.textBaseline='middle';
  g.shadowColor='#'+hex.toString(16).padStart(6,'0');g.shadowBlur=14;
  g.fillText(text,s/2,34);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,fog:false}));
  sp.position.set(x,y,z);sp.scale.set(13,3.25,1);return sp;
}

// 中心コア（淡い光球）
const core = new THREE.Mesh(new THREE.SphereGeometry(2.2,32,32),
  new THREE.MeshBasicMaterial({color:0x6b7cff,transparent:true,opacity:0.25}));
scene.add(core);
const halo = new THREE.PointLight(0x5b78ff, 2, 200); scene.add(halo);
scene.add(new THREE.AmbientLight(0x404060));

// ホバー判定
const ray = new THREE.Raycaster(); ray.params.Points.threshold = 1.6;
const mouse = new THREE.Vector2(-9,-9);
const tip = document.getElementById('tip');
addEventListener('pointermove', e=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  tip._x=e.clientX; tip._y=e.clientY;
});
function hover(){
  ray.setFromCamera(mouse,camera);
  const hit = ray.intersectObject(points);
  if(hit.length){
    const m = meta[hit[0].index];
    tip.style.display='block';
    tip.style.left=(tip._x+14)+'px'; tip.style.top=(tip._y+14)+'px';
    tip.querySelector('.c').textContent=m.cat; tip.querySelector('.c').style.color=m.color;
    tip.querySelector('.t').textContent=m.title;
    tip.querySelector('.m').innerHTML='🌐 EN→JA 翻訳 · 担当エージェント監修';
    controls.autoRotate=false;
  } else { tip.style.display='none'; controls.autoRotate=true; }
}

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

let t=0;
(function loop(){
  requestAnimationFrame(loop);
  t+=0.01; core.scale.setScalar(1+Math.sin(t)*0.06);
  hover(); controls.update(); renderer.render(scene,camera);
})();
</script>
</body>
</html>
